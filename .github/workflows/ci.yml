name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibeproof_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vibeproof_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/vibeproof_test
      REDIS_URL: redis://localhost:6379
      SKIP_NETWORK_TESTS: "1"
      SESSION_SECRET: ci-only-session-secret-not-a-production-credential
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type safety and migration manifest
        run: npm run lint
      - name: Check formatting of changed source
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check
      - run: npm audit --audit-level=high
      - name: Compile and test deployed registry primitive
        run: |
          npm run forge:build
          npm run forge:test
      - name: Migrate test database twice
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Unit, PostgreSQL, and local EVM regressions
        env:
          ANVIL_BIN: ${{ github.workspace }}/node_modules/@foundry-rs/anvil-linux-amd64/bin/anvil
        run: npm run test:local
      - name: Production build
        run: npm run build
      - name: Deterministic browser journeys (desktop and mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:build
          npm run test:e2e
      - name: Real wallet, SIWE, registry, and public proof journeys
        env:
          ANVIL_BIN: ${{ github.workspace }}/node_modules/@foundry-rs/anvil-linux-amd64/bin/anvil
        run: npm run test:wallet
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan tracked history for secrets (redacted output)
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt --output /tmp/gitleaks-checksums.txt
          cd /tmp
          mv gitleaks.tar.gz gitleaks_8.24.3_linux_x64.tar.gz
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --no-banner
