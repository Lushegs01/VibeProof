name: Indexer cron

# Triggers one bounded indexer run on the deployed app every 5 minutes.
# Works on any Vercel plan (Vercel Cron is limited to daily jobs on Hobby).
# Required repository secrets:
#   VIBEPROOF_URL  – production URL, e.g. https://vibe-proof.vercel.app
#   CRON_SECRET    – same value as the CRON_SECRET env var in Vercel
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: indexer-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger indexer run
        env:
          VIBEPROOF_URL: ${{ secrets.VIBEPROOF_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VIBEPROOF_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::VIBEPROOF_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${VIBEPROOF_URL%/}/api/cron/indexer")
          cat response.json; echo
          test "$status" = "200"
