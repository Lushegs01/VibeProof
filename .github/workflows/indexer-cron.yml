name: Indexer cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: indexer-cron
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate configuration and execute indexer
        env:
          VIBEPROOF_URL: ${{ secrets.VIBEPROOF_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VIBEPROOF_ALLOWED_HOSTS: ${{ vars.VIBEPROOF_ALLOWED_HOSTS }}
        run: node scripts/trigger-indexer.mjs

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Probe operations independently of the indexer job
        env:
          VIBEPROOF_URL: ${{ secrets.VIBEPROOF_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VIBEPROOF_ALLOWED_HOSTS: ${{ vars.VIBEPROOF_ALLOWED_HOSTS }}
        run: node scripts/trigger-monitor.mjs
